name: Compatibility checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.19.0', '22.23.1']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install frozen test dependencies
        run: npm exec --yes --package=pnpm@11.10.0 -- pnpm install --frozen-lockfile --ignore-scripts
      - name: Test runtime and installer
        run: node node_modules/vitest/vitest.mjs run
      - name: Check types
        run: node node_modules/typescript/bin/tsc
      - name: Check lint
        run: node node_modules/oxlint/bin/oxlint
      - name: Build package
        run: npm exec --yes --package=pnpm@11.10.0 -- pnpm run build
      - name: Check package contents and exports
        run: node scripts/verify-pack.mjs
      - name: Replay terminal interactions
        if: runner.os != 'Windows'
        run: node scripts/terminal-pty-check.mjs
      - name: Check standalone entry
        run: node scripts/install.mjs --help
      - name: Check Unix bootstrap syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh
      - name: Check PowerShell bootstrap syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
